apiVersion: batch/v1
kind: Job
metadata:
  name: database-migration
  namespace: default
  labels:
    app: database-migration
    component: migration
spec:
  template:
    metadata:
      labels:
        app: database-migration
        component: migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migration
        image: migrate/migrate:latest
        command:
        - migrate
        - "-path=/migrations"
        - "-database"
        - "postgres://postgres:devops-e2e-password@postgresql-primary:5432/devops_e2e?sslmode=disable"
        - "up"
        env:
        - name: POSTGRES_HOST
          value: "postgresql-primary"
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: "devops_e2e"
        - name: POSTGRES_USER
          value: "postgres"
        - name: POSTGRES_PASSWORD
          value: "devops-e2e-password"
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: migrations
        configMap:
          name: database-migrations
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-migrations
  namespace: default
data:
  "000001_create_initial_schema.up.sql": |
    -- Migration: Create Initial Schema
    -- Version: 000001
    -- Description: Create initial database schema for DevOps E2E Platform

    -- Enable pgVector extension for vector operations
    CREATE EXTENSION IF NOT EXISTS vector;

    -- Create users table
    CREATE TABLE IF NOT EXISTS users (
        id SERIAL PRIMARY KEY,
        email VARCHAR(255) UNIQUE NOT NULL,
        password_hash VARCHAR(255) NOT NULL,
        first_name VARCHAR(100) NOT NULL,
        last_name VARCHAR(100) NOT NULL,
        is_active BOOLEAN DEFAULT true,
        email_verified BOOLEAN DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create orders table
    CREATE TABLE IF NOT EXISTS orders (
        id SERIAL PRIMARY KEY,
        user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        order_number VARCHAR(50) UNIQUE NOT NULL,
        status VARCHAR(50) NOT NULL DEFAULT 'pending',
        total_amount DECIMAL(10,2) NOT NULL,
        items JSONB NOT NULL,
        shipping_address JSONB,
        billing_address JSONB,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP,
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create audit_logs table for tracking changes
    CREATE TABLE IF NOT EXISTS audit_logs (
        id SERIAL PRIMARY KEY,
        table_name VARCHAR(100) NOT NULL,
        record_id INTEGER NOT NULL,
        action VARCHAR(50) NOT NULL,
        old_values JSONB,
        new_values JSONB,
        user_id INTEGER REFERENCES users(id),
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create refresh_tokens table for JWT refresh tokens
    CREATE TABLE IF NOT EXISTS refresh_tokens (
        id SERIAL PRIMARY KEY,
        user_id INTEGER NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        token_hash VARCHAR(255) NOT NULL UNIQUE,
        expires_at TIMESTAMP WITH TIME ZONE NOT NULL,
        is_revoked BOOLEAN DEFAULT false,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );

    -- Create indexes for better performance
    CREATE INDEX IF NOT EXISTS idx_users_email ON users(email);
    CREATE INDEX IF NOT EXISTS idx_users_is_active ON users(is_active);
    CREATE INDEX IF NOT EXISTS idx_orders_user_id ON orders(user_id);
    CREATE INDEX IF NOT EXISTS idx_orders_status ON orders(status);
    CREATE INDEX IF NOT EXISTS idx_orders_created_at ON orders(created_at);
    CREATE INDEX IF NOT EXISTS idx_orders_order_number ON orders(order_number);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_table_record ON audit_logs(table_name, record_id);
    CREATE INDEX IF NOT EXISTS idx_audit_logs_created_at ON audit_logs(created_at);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_user_id ON refresh_tokens(user_id);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_token_hash ON refresh_tokens(token_hash);
    CREATE INDEX IF NOT EXISTS idx_refresh_tokens_expires_at ON refresh_tokens(expires_at);

    -- Create function to update updated_at timestamp
    CREATE OR REPLACE FUNCTION update_updated_at_column()
    RETURNS TRIGGER AS $$
    BEGIN
        NEW.updated_at = CURRENT_TIMESTAMP;
        RETURN NEW;
    END;
    $$ language 'plpgsql';

    -- Create triggers for updated_at
    CREATE TRIGGER update_users_updated_at BEFORE UPDATE ON users
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    CREATE TRIGGER update_orders_updated_at BEFORE UPDATE ON orders
        FOR EACH ROW EXECUTE FUNCTION update_updated_at_column();

    -- Create function for audit logging
    CREATE OR REPLACE FUNCTION audit_trigger_function()
    RETURNS TRIGGER AS $$
    BEGIN
        IF TG_OP = 'INSERT' THEN
            INSERT INTO audit_logs (table_name, record_id, action, new_values, user_id)
            VALUES (TG_TABLE_NAME, NEW.id, 'INSERT', to_jsonb(NEW), NEW.user_id);
            RETURN NEW;
        ELSIF TG_OP = 'UPDATE' THEN
            INSERT INTO audit_logs (table_name, record_id, action, old_values, new_values, user_id)
            VALUES (TG_TABLE_NAME, NEW.id, 'UPDATE', to_jsonb(OLD), to_jsonb(NEW), NEW.user_id);
            RETURN NEW;
        ELSIF TG_OP = 'DELETE' THEN
            INSERT INTO audit_logs (table_name, record_id, action, old_values, user_id)
            VALUES (TG_TABLE_NAME, OLD.id, 'DELETE', to_jsonb(OLD), OLD.user_id);
            RETURN OLD;
        END IF;
        RETURN NULL;
    END;
    $$ language 'plpgsql';

    -- Create audit triggers
    CREATE TRIGGER audit_users_trigger AFTER INSERT OR UPDATE OR DELETE ON users
        FOR EACH ROW EXECUTE FUNCTION audit_trigger_function();

    CREATE TRIGGER audit_orders_trigger AFTER INSERT OR UPDATE OR DELETE ON orders
        FOR EACH ROW EXECUTE FUNCTION audit_trigger_function();

    -- Grant necessary permissions
    GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO postgres;
    GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO postgres;

  "000001_create_initial_schema.down.sql": |
    -- Migration: Rollback Initial Schema
    -- Version: 000001
    -- Description: Rollback initial database schema for DevOps E2E Platform

    -- Drop audit triggers
    DROP TRIGGER IF EXISTS audit_users_trigger ON users;
    DROP TRIGGER IF EXISTS audit_orders_trigger ON orders;

    -- Drop updated_at triggers
    DROP TRIGGER IF EXISTS update_users_updated_at ON users;
    DROP TRIGGER IF EXISTS update_orders_updated_at ON orders;

    -- Drop functions
    DROP FUNCTION IF EXISTS audit_trigger_function();
    DROP FUNCTION IF EXISTS update_updated_at_column();

    -- Drop indexes
    DROP INDEX IF EXISTS idx_refresh_tokens_expires_at;
    DROP INDEX IF EXISTS idx_refresh_tokens_token_hash;
    DROP INDEX IF EXISTS idx_refresh_tokens_user_id;
    DROP INDEX IF EXISTS idx_audit_logs_created_at;
    DROP INDEX IF EXISTS idx_audit_logs_table_record;
    DROP INDEX IF EXISTS idx_orders_order_number;
    DROP INDEX IF EXISTS idx_orders_created_at;
    DROP INDEX IF EXISTS idx_orders_status;
    DROP INDEX IF EXISTS idx_orders_user_id;
    DROP INDEX IF EXISTS idx_users_is_active;
    DROP INDEX IF EXISTS idx_users_email;

    -- Drop tables
    DROP TABLE IF EXISTS refresh_tokens;
    DROP TABLE IF EXISTS audit_logs;
    DROP TABLE IF EXISTS orders;
    DROP TABLE IF EXISTS users;

    -- Drop pgVector extension
    DROP EXTENSION IF EXISTS vector;

