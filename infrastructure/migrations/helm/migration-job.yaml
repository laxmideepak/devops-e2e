{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "devops-e2e.fullname" . }}-migration
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devops-e2e.labels" . | nindent 4 }}
    component: migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "devops-e2e.selectorLabels" . | nindent 8 }}
        component: migration
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migration
        image: {{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}
        command:
        - migrate
        - "-path=/migrations"
        - "-database"
        - "postgres://{{ .Values.postgresql.auth.username }}:{{ .Values.postgresql.auth.password }}@{{ include "postgresql.fullname" . }}:{{ .Values.postgresql.primary.service.ports.postgresql }}/{{ .Values.postgresql.auth.database }}?sslmode=disable"
        - "up"
        env:
        - name: POSTGRES_HOST
          value: {{ include "postgresql.fullname" . }}
        - name: POSTGRES_PORT
          value: {{ .Values.postgresql.primary.service.ports.postgresql | quote }}
        - name: POSTGRES_DB
          value: {{ .Values.postgresql.auth.database }}
        - name: POSTGRES_USER
          value: {{ .Values.postgresql.auth.username }}
        - name: POSTGRES_PASSWORD
          value: {{ .Values.postgresql.auth.password }}
        volumeMounts:
        - name: migrations
          mountPath: /migrations
        resources:
          {{- toYaml .Values.migrations.resources | nindent 10 }}
      volumes:
      - name: migrations
        configMap:
          name: {{ include "devops-e2e.fullname" . }}-migrations
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "devops-e2e.fullname" . }}-migrations
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "devops-e2e.labels" . | nindent 4 }}
    component: migration
data:
  {{- $files := .Files }}
  {{- range $path, $_ :=  .Files.Glob "infrastructure/migrations/scripts/*.sql" }}
  {{ base $path }}: |
    {{- $files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
