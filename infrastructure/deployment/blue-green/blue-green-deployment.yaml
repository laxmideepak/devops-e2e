apiVersion: v1
kind: Namespace
metadata:
  name: devops-e2e-blue
  labels:
    environment: blue
    version: stable
---
apiVersion: v1
kind: Namespace
metadata:
  name: devops-e2e-green
  labels:
    environment: green
    version: preview
---
# Blue Environment Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-blue
  namespace: devops-e2e-blue
  labels:
    app: api-gateway
    version: blue
    environment: stable
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
      version: blue
  template:
    metadata:
      labels:
        app: api-gateway
        version: blue
        environment: stable
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/laxmideepak/devops-e2e-api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service-blue:3001"
        - name: USER_SERVICE_URL
          value: "http://user-service-blue:3002"
        - name: ORDER_SERVICE_URL
          value: "http://order-service-blue:3003"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Blue Environment Services
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-blue
  namespace: devops-e2e-blue
  labels:
    app: api-gateway
    version: blue
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: api-gateway
    version: blue
---
# Green Environment Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-green
  namespace: devops-e2e-green
  labels:
    app: api-gateway
    version: green
    environment: preview
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
      version: green
  template:
    metadata:
      labels:
        app: api-gateway
        version: green
        environment: preview
    spec:
      containers:
      - name: api-gateway
        image: ghcr.io/laxmideepak/devops-e2e-api-gateway:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: AUTH_SERVICE_URL
          value: "http://auth-service-green:3001"
        - name: USER_SERVICE_URL
          value: "http://user-service-green:3002"
        - name: ORDER_SERVICE_URL
          value: "http://order-service-green:3003"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
---
# Green Environment Services
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-green
  namespace: devops-e2e-green
  labels:
    app: api-gateway
    version: green
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: api-gateway
    version: green
---
# Traffic Router Service
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-router
  namespace: default
  labels:
    app: api-gateway
    component: router
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: traffic-router
---
# Traffic Router Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-router
  namespace: default
  labels:
    app: traffic-router
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traffic-router
  template:
    metadata:
      labels:
        app: traffic-router
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: nginx-config
        configMap:
          name: traffic-router-config
---
# Traffic Router ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-router-config
  namespace: default
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }
    
    http {
      upstream blue {
        server api-gateway-blue.devops-e2e-blue.svc.cluster.local:3000;
      }
      
      upstream green {
        server api-gateway-green.devops-e2e-green.svc.cluster.local:3000;
      }
      
      # Default to blue (stable)
      upstream active {
        server api-gateway-blue.devops-e2e-blue.svc.cluster.local:3000;
      }
      
      server {
        listen 80;
        
        location / {
          proxy_pass http://active;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        location /health {
          proxy_pass http://active;
        }
        
        location /metrics {
          proxy_pass http://active;
        }
      }
    }
