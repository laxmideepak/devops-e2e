{{- if .Values.apiGateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-e2e.fullname" . }}-api-gateway
  labels:
    {{- include "devops-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  replicas: {{ .Values.apiGateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "devops-e2e.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api-gateway
  template:
    metadata:
      labels:
        {{- include "devops-e2e.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api-gateway
      {{- with .Values.apiGateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityStandards.securityContext | nindent 8 }}
      containers:
        - name: api-gateway
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.apiGateway.image.repository }}:{{ .Values.apiGateway.image.tag }}"
          imagePullPolicy: {{ .Values.apiGateway.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.apiGateway.service.targetPort }}
              protocol: TCP
          env:
            - name: NODE_ENV
              value: {{ .Values.apiGateway.env.NODE_ENV | quote }}
            - name: PORT
              value: {{ .Values.apiGateway.env.PORT | quote }}
            - name: AUTH_SERVICE_URL
              value: {{ .Values.apiGateway.env.AUTH_SERVICE_URL | quote }}
            - name: USER_SERVICE_URL
              value: {{ .Values.apiGateway.env.USER_SERVICE_URL | quote }}
            - name: ORDER_SERVICE_URL
              value: {{ .Values.apiGateway.env.ORDER_SERVICE_URL | quote }}
            - name: ALLOWED_ORIGINS
              value: {{ .Values.apiGateway.env.ALLOWED_ORIGINS | quote }}
          resources:
            {{- toYaml .Values.apiGateway.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.podSecurityStandards.containerSecurityContext | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-e2e.fullname" . }}-api-gateway
  labels:
    {{- include "devops-e2e.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: {{ .Values.apiGateway.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "devops-e2e.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
{{- end }}
