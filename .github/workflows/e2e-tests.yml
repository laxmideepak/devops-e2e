name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'e2e/**'
      - 'services/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'e2e/**'
      - 'services/**'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - auth
          - orders
          - api
      environment:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  setup-environment:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start services with docker-compose
      run: |
        echo "🚀 Starting services for E2E testing..."
        docker-compose -f infrastructure/docker-compose/docker-compose.yml up -d
        
        echo "⏳ Waiting for services to be ready..."
        timeout 300 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done' || echo "API Gateway not ready"
        timeout 300 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done' || echo "Auth Service not ready"
        timeout 300 bash -c 'until curl -f http://localhost:3002/health; do sleep 5; done' || echo "User Service not ready"
        timeout 300 bash -c 'until curl -f http://localhost:3003/health; do sleep 5; done' || echo "Order Service not ready"
        
        echo "✅ Services setup completed!"

    - name: Run database migrations
      run: |
        echo "🗄️  Running database migrations..."
        ./infrastructure/migrations/scripts/manage-migrations.sh up || echo "Migrations already applied"

  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: [setup-environment]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install Playwright
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Run Playwright tests
      working-directory: e2e
      env:
        CI: true
        API_BASE_URL: http://localhost:3000
        AUTH_SERVICE_URL: http://localhost:3001
        USER_SERVICE_URL: http://localhost:3002
        ORDER_SERVICE_URL: http://localhost:3003
      run: |
        echo "🧪 Running E2E tests..."
        if [ "${{ github.event.inputs.test_type }}" = "smoke" ]; then
          npx playwright test --grep @smoke --reporter=junit,html
        elif [ "${{ github.event.inputs.test_type }}" = "auth" ]; then
          npx playwright test --grep @auth --reporter=junit,html
        elif [ "${{ github.event.inputs.test_type }}" = "orders" ]; then
          npx playwright test --grep @orders --reporter=junit,html
        elif [ "${{ github.event.inputs.test_type }}" = "api" ]; then
          npx playwright test --grep @api --reporter=junit,html
        else
          npx playwright test --reporter=junit,html
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: e2e-test-results
        path: |
          e2e/test-results/
          e2e/playwright-report/
        retention-days: 30

    - name: Upload screenshots on failure
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: e2e-screenshots
        path: e2e/test-results/
        retention-days: 30

  test-results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [run-e2e-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download test results
      uses: actions/download-artifact@v4
      with:
        name: e2e-test-results
        path: e2e/

    - name: Generate test report
      working-directory: e2e
      run: |
        echo "📊 Generating test report..."
        if [ -d "playwright-report" ]; then
          echo "✅ Test report generated successfully"
          ls -la playwright-report/
        else
          echo "⚠️  No test report found"
        fi

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ needs.run-e2e-tests.result }}' === 'success' ? '✅ Passed' : '❌ Failed';
          const commentBody = `## 🧪 E2E Test Results
          
          **Status:** ${status}
          
          **Test Type:** ${{ github.event.inputs.test_type || 'all' }}
          **Environment:** ${{ github.event.inputs.environment || 'staging' }}
          
          **Details:**
          - E2E Tests: ${{ needs.run-e2e-tests.result }}
          
          [View Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody,
          });

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [test-results]
    if: always()
    
    steps:
    - name: Stop services
      run: |
        echo "🧹 Cleaning up test environment..."
        docker-compose -f infrastructure/docker-compose/docker-compose.yml down -v || true
        
    - name: Cleanup artifacts
      run: |
        echo "🗑️  Cleaning up artifacts..."
        rm -rf e2e/test-results/ || true
        rm -rf e2e/playwright-report/ || true
