name: E2E Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'e2e/**'
      - 'services/**'
      - '.github/workflows/e2e-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'e2e/**'
      - 'services/**'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - auth
          - orders
          - api
      environment:
        description: 'Environment to test against'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '18'
  PLAYWRIGHT_BROWSERS_PATH: '0'

jobs:
  setup-services:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start services with docker-compose
      run: |
        echo "🚀 Starting services for E2E testing..."
        docker-compose -f infrastructure/docker-compose/docker-compose.yml up -d
        
        echo "⏳ Waiting for services to be ready..."
        timeout 300 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:3002/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:3003/health; do sleep 5; done'
        
        echo "✅ All services are ready!"

    - name: Run database migrations
      run: |
        echo "🗄️  Running database migrations..."
        ./infrastructure/migrations/scripts/manage-migrations.sh up || echo "Migrations already applied"

  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    needs: setup-services
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Install Playwright
      working-directory: e2e
      run: |
        npm ci
        npx playwright install --with-deps

    - name: Upload Playwright browsers
      uses: actions/upload-artifact@v4
      with:
        name: playwright-browsers
        path: ~/.cache/ms-playwright
        retention-days: 1

  run-e2e-tests:
    name: Run E2E Tests
    runs-on: ubuntu-latest
    needs: [setup-services, install-dependencies]
    strategy:
      matrix:
        browser: [chromium, firefox, webkit]
        test_type: [${{ github.event.inputs.test_type || 'all' }}]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Download Playwright browsers
      uses: actions/download-artifact@v4
      with:
        name: playwright-browsers
        path: ~/.cache/ms-playwright

    - name: Install dependencies
      working-directory: e2e
      run: npm ci

    - name: Run Playwright tests
      working-directory: e2e
      env:
        CI: true
        API_BASE_URL: http://localhost:3000
        AUTH_SERVICE_URL: http://localhost:3001
        USER_SERVICE_URL: http://localhost:3002
        ORDER_SERVICE_URL: http://localhost:3003
      run: |
        if [ "${{ matrix.test_type }}" = "all" ]; then
          npx playwright test --project=${{ matrix.browser }} --reporter=junit,html
        elif [ "${{ matrix.test_type }}" = "smoke" ]; then
          npx playwright test --project=${{ matrix.browser }} --grep @smoke --reporter=junit,html
        elif [ "${{ matrix.test_type }}" = "auth" ]; then
          npx playwright test --project=${{ matrix.browser }} --grep @auth --reporter=junit,html
        elif [ "${{ matrix.test_type }}" = "orders" ]; then
          npx playwright test --project=${{ matrix.browser }} --grep @orders --reporter=junit,html
        elif [ "${{ matrix.test_type }}" = "api" ]; then
          npx playwright test --project=${{ matrix.browser }} --grep @api --reporter=junit,html
        fi

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.browser }}-${{ matrix.test_type }}
        path: |
          e2e/test-results/
          e2e/playwright-report/
        retention-days: 30

    - name: Upload screenshots
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: screenshots-${{ matrix.browser }}-${{ matrix.test_type }}
        path: e2e/test-results/
        retention-days: 30

  run-parallel-tests:
    name: Run Parallel Tests
    runs-on: ubuntu-latest
    needs: [setup-services, install-dependencies]
    strategy:
      matrix:
        test_suite: [auth, orders, api]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Download Playwright browsers
      uses: actions/download-artifact@v4
      with:
        name: playwright-browsers
        path: ~/.cache/ms-playwright

    - name: Install dependencies
      working-directory: e2e
      run: npm ci

    - name: Run specific test suite
      working-directory: e2e
      env:
        CI: true
        API_BASE_URL: http://localhost:3000
        AUTH_SERVICE_URL: http://localhost:3001
        USER_SERVICE_URL: http://localhost:3002
        ORDER_SERVICE_URL: http://localhost:3003
      run: |
        npx playwright test --project=chromium --grep @${{ matrix.test_suite }} --reporter=junit,html

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.test_suite }}
        path: |
          e2e/test-results/
          e2e/playwright-report/
        retention-days: 30

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: [setup-services, install-dependencies]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Download Playwright browsers
      uses: actions/download-artifact@v4
      with:
        name: playwright-browsers
        path: ~/.cache/ms-playwright

    - name: Install dependencies
      working-directory: e2e
      run: npm ci

    - name: Run performance tests
      working-directory: e2e
      env:
        CI: true
        API_BASE_URL: http://localhost:3000
        AUTH_SERVICE_URL: http://localhost:3001
        USER_SERVICE_URL: http://localhost:3002
        ORDER_SERVICE_URL: http://localhost:3003
      run: |
        # Run tests with performance monitoring
        npx playwright test --project=chromium --grep @performance --reporter=junit,html || echo "No performance tests found"

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: e2e/test-results/
        retention-days: 30

  generate-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs: [run-e2e-tests, run-parallel-tests, performance-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: e2e/package-lock.json

    - name: Download all test results
      uses: actions/download-artifact@v4
      with:
        path: test-results/

    - name: Generate combined report
      working-directory: e2e
      run: |
        # Combine test results and generate report
        npx playwright show-report || echo "No report to show"

    - name: Upload combined report
      uses: actions/upload-artifact@v4
      with:
        name: e2e-test-report
        path: e2e/playwright-report/
        retention-days: 30

  notify-results:
    name: Notify Test Results
    runs-on: ubuntu-latest
    needs: [generate-report]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.run-e2e-tests.result }}" = "success" ] && [ "${{ needs.run-parallel-tests.result }}" = "success" ]; then
          echo "✅ All E2E tests passed!"
        else
          echo "❌ Some E2E tests failed!"
          exit 1
        fi

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: comments } = await github.rest.issues.listComments({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
          });
          
          const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('E2E Tests'));
          
          const commentBody = `## E2E Test Results
          
          **Status:** ${{ needs.run-e2e-tests.result == 'success' && needs.run-parallel-tests.result == 'success' ? '✅ Passed' : '❌ Failed' }}
          
          **Test Types:** ${{ github.event.inputs.test_type || 'all' }}
          **Environment:** ${{ github.event.inputs.environment || 'staging' }}
          
          **Details:**
          - Browser Tests: ${{ needs.run-e2e-tests.result }}
          - Parallel Tests: ${{ needs.run-parallel-tests.result }}
          - Performance Tests: ${{ needs.performance-tests.result }}
          
          [View Test Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          
          if (botComment) {
            await github.rest.issues.updateComment({
              comment_id: botComment.id,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
          } else {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: commentBody,
            });
          }

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [notify-results]
    if: always()
    
    steps:
    - name: Stop services
      run: |
        echo "🧹 Cleaning up test environment..."
        docker-compose -f infrastructure/docker-compose/docker-compose.yml down -v || true
        
    - name: Cleanup artifacts
      run: |
        echo "🗑️  Cleaning up artifacts..."
        rm -rf e2e/test-results/ || true
        rm -rf e2e/playwright-report/ || true
