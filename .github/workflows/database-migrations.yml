name: Database Migrations

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'infrastructure/migrations/**'
      - '.github/workflows/database-migrations.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'infrastructure/migrations/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to run migrations on'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      action:
        description: 'Migration action'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
          - status

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  validate-migrations:
    name: Validate Migration Files
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate migration files
      run: |
        echo "🔍 Validating migration files..."
        
        MIGRATIONS_PATH="./infrastructure/migrations/scripts"
        
        # Check if migrations directory exists
        if [ ! -d "$MIGRATIONS_PATH" ]; then
          echo "❌ Migrations directory not found: $MIGRATIONS_PATH"
          exit 1
        fi
        
        # Check for paired migration files
        up_files=$(find $MIGRATIONS_PATH -name "*.up.sql" | sort)
        down_files=$(find $MIGRATIONS_PATH -name "*.down.sql" | sort)
        
        echo "📁 Found migration files:"
        echo "Up migrations:"
        echo "$up_files"
        echo ""
        echo "Down migrations:"
        echo "$down_files"
        
        # Validate that each up migration has a corresponding down migration
        for up_file in $up_files; do
          base_name=$(basename "$up_file" .up.sql)
          down_file="$MIGRATIONS_PATH/${base_name}.down.sql"
          
          if [ ! -f "$down_file" ]; then
            echo "⚠️  Missing down migration for: $base_name"
            exit 1
          else
            echo "✅ $base_name has both up and down migrations"
          fi
        done
        
        echo "✅ All migration files are valid!"

  test-migrations-local:
    name: Test Migrations Locally
    runs-on: ubuntu-latest
    needs: validate-migrations
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: devops_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'

    - name: Install golang-migrate
      run: |
        go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

    - name: Wait for PostgreSQL
      run: |
        echo "⏳ Waiting for PostgreSQL to be ready..."
        until pg_isready -h localhost -p 5432 -U postgres; do
          echo "PostgreSQL is not ready yet..."
          sleep 2
        done
        echo "✅ PostgreSQL is ready!"

    - name: Test migrations
      run: |
        echo "🧪 Testing migrations..."
        
        # Set database URL
        export DATABASE_URL="postgres://postgres:password@localhost:5432/devops_e2e?sslmode=disable"
        
        # Run migrations
        migrate -path ./infrastructure/migrations/scripts -database "$DATABASE_URL" up
        
        # Check migration status
        migrate -path ./infrastructure/migrations/scripts -database "$DATABASE_URL" version
        
        # Test rollback
        migrate -path ./infrastructure/migrations/scripts -database "$DATABASE_URL" down 1
        
        # Run migrations again
        migrate -path ./infrastructure/migrations/scripts -database "$DATABASE_URL" up
        
        echo "✅ Migration tests completed successfully!"

  deploy-migrations-staging:
    name: Deploy Migrations to Staging
    runs-on: ubuntu-latest
    needs: [validate-migrations, test-migrations-local]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Run migrations in staging
      run: |
        echo "🚀 Running migrations in staging environment..."
        
        # Apply migration job
        kubectl apply -f ./infrastructure/migrations/kubernetes/migration-job.yaml
        
        # Wait for job to complete
        kubectl wait --for=condition=complete job/database-migration --timeout=300s
        
        # Check job status
        job_status=$(kubectl get job database-migration -o jsonpath='{.status.succeeded}')
        
        if [ "$job_status" = "1" ]; then
          echo "✅ Staging migrations completed successfully"
          
          # Clean up the job
          kubectl delete job database-migration
        else
          echo "❌ Staging migrations failed"
          
          # Show job logs
          kubectl logs job/database-migration
          exit 1
        fi

  deploy-migrations-production:
    name: Deploy Migrations to Production
    runs-on: ubuntu-latest
    needs: [validate-migrations, test-migrations-local]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        export KUBECONFIG=kubeconfig

    - name: Run migrations in production
      run: |
        echo "🚀 Running migrations in production environment..."
        
        # Apply migration job
        kubectl apply -f ./infrastructure/migrations/kubernetes/migration-job.yaml
        
        # Wait for job to complete
        kubectl wait --for=condition=complete job/database-migration --timeout=300s
        
        # Check job status
        job_status=$(kubectl get job database-migration -o jsonpath='{.status.succeeded}')
        
        if [ "$job_status" = "1" ]; then
          echo "✅ Production migrations completed successfully"
          
          # Clean up the job
          kubectl delete job database-migration
        else
          echo "❌ Production migrations failed"
          
          # Show job logs
          kubectl logs job/database-migration
          exit 1
        fi

  manual-migration:
    name: Manual Migration
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'latest'

    - name: Configure kubectl
      run: |
        if [ "${{ github.event.inputs.environment }}" = "production" ]; then
          echo "${{ secrets.KUBE_CONFIG_PRODUCTION }}" | base64 -d > kubeconfig
        else
          echo "${{ secrets.KUBE_CONFIG_STAGING }}" | base64 -d > kubeconfig
        fi
        export KUBECONFIG=kubeconfig

    - name: Run manual migration
      run: |
        echo "🔧 Running manual migration: ${{ github.event.inputs.action }}"
        echo "Environment: ${{ github.event.inputs.environment }}"
        
        if [ "${{ github.event.inputs.action }}" = "status" ]; then
          # Show migration status
          kubectl run migration-status --image=migrate/migrate:latest --rm -i --restart=Never -- \
            migrate -path=/migrations -database="postgres://postgres:devops-e2e-password@postgresql-primary:5432/devops_e2e?sslmode=disable" version
        else
          # Run migration job with specific action
          kubectl apply -f ./infrastructure/migrations/kubernetes/migration-job.yaml
          
          # Wait for job to complete
          kubectl wait --for=condition=complete job/database-migration --timeout=300s
          
          # Check job status
          job_status=$(kubectl get job database-migration -o jsonpath='{.status.succeeded}')
          
          if [ "$job_status" = "1" ]; then
            echo "✅ Manual migration completed successfully"
            
            # Clean up the job
            kubectl delete job database-migration
          else
            echo "❌ Manual migration failed"
            
            # Show job logs
            kubectl logs job/database-migration
            exit 1
          fi
        fi
