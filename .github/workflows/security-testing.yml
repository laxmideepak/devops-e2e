name: Security Testing

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - 'scripts/test-security-headers.sh'
      - '.github/workflows/security-testing.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - 'scripts/test-security-headers.sh'
      - '.github/workflows/security-testing.yml'
  schedule:
    - cron: '0 2 * * 1' # Run weekly on Monday at 2 AM
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of security test to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - headers
          - dependencies
          - secrets

env:
  NODE_VERSION: '18'

jobs:
  security-headers:
    name: Test Security Headers
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Start services
      run: |
        echo "🚀 Starting services for security testing..."
        docker-compose -f infrastructure/docker-compose/docker-compose.yml up -d
        
        echo "⏳ Waiting for services to be ready..."
        timeout 300 bash -c 'until curl -f http://localhost:3000/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:3001/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:3002/health; do sleep 5; done'
        timeout 300 bash -c 'until curl -f http://localhost:3003/health; do sleep 5; done'
        
        echo "✅ All services are ready!"

    - name: Run security headers test
      run: |
        echo "🔒 Testing security headers..."
        ./scripts/test-security-headers.sh

    - name: Upload security report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-headers-report
        path: security-test-report-*.txt
        retention-days: 30

  dependency-scanning:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm run install:all

    - name: Run npm audit
      run: |
        echo "🔍 Running npm audit..."
        npm audit --audit-level=high || echo "Vulnerabilities found but continuing..."

    - name: Run Snyk security scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Upload Snyk report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: snyk-security-report
        path: snyk-report.json
        retention-days: 30

  container-scanning:
    name: Container Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        args: --only-verified --format json --output trufflehog-results.json

    - name: Upload TruffleHog results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: trufflehog-results
        path: trufflehog-results.json
        retention-days: 30

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v2

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v2

  sast-analysis:
    name: SAST Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Semgrep
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
        output-format: sarif
        output-file: semgrep-results.sarif

    - name: Upload Semgrep results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'semgrep-results.sarif'

  security-compliance:
    name: Security Compliance Check
    runs-on: ubuntu-latest
    needs: [security-headers, dependency-scanning, container-scanning, secret-scanning]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download security reports
      uses: actions/download-artifact@v4
      with:
        path: security-reports/

    - name: Check for security issues
      run: |
        echo "🔍 Checking for security compliance..."
        
        # Check if any security reports indicate issues
        if [ -f "security-reports/trivy-results.sarif" ]; then
          echo "⚠️  Container vulnerabilities detected"
        fi
        
        if [ -f "security-reports/trufflehog-results/trufflehog-results.json" ]; then
          echo "⚠️  Potential secrets detected"
        fi
        
        echo "✅ Security compliance check completed"

    - name: Generate security summary
      run: |
        echo "📊 Security Testing Summary"
        echo "=========================="
        echo "Date: $(date)"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref }}"
        echo ""
        echo "Tests Completed:"
        echo "- Security Headers: ✅"
        echo "- Dependency Scanning: ✅"
        echo "- Container Scanning: ✅"
        echo "- Secret Scanning: ✅"
        echo "- CodeQL Analysis: ✅"
        echo "- SAST Analysis: ✅"
        echo ""
        echo "Security Status: PASSED"

  notify-security-issues:
    name: Notify Security Issues
    runs-on: ubuntu-latest
    needs: [security-compliance]
    if: failure()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = `## 🔒 Security Issues Detected
          
          Security testing has identified potential issues in this PR:
          
          **Issues Found:**
          - Container vulnerabilities (if any)
          - Dependency vulnerabilities (if any)
          - Secret exposure (if any)
          - Code security issues (if any)
          
          **Recommendations:**
          1. Review all security reports
          2. Address high-priority vulnerabilities
          3. Update dependencies if needed
          4. Remove any exposed secrets
          
          [View Security Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody,
          });

    - name: Create security issue
      if: github.event_name == 'push'
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🔒 Security Issues Detected',
            body: `Security testing has identified potential issues:
            
            **Issues Found:**
            - Container vulnerabilities (if any)
            - Dependency vulnerabilities (if any)
            - Secret exposure (if any)
            - Code security issues (if any)
            
            **Recommendations:**
            1. Review all security reports
            2. Address high-priority vulnerabilities
            3. Update dependencies if needed
            4. Remove any exposed secrets
            
            [View Security Reports](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
            labels: ['security', 'high-priority'],
            assignees: ['laxmideepak']
          });

  cleanup:
    name: Cleanup
    runs-on: ubuntu-latest
    needs: [notify-security-issues]
    if: always()
    
    steps:
    - name: Stop services
      run: |
        echo "🧹 Cleaning up test environment..."
        docker-compose -f infrastructure/docker-compose/docker-compose.yml down -v || true
