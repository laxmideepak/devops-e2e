name: Code Coverage

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'services/**'
      - '.github/workflows/code-coverage.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'services/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to test (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - api-gateway
          - auth-service
          - user-service
          - order-service

env:
  NODE_VERSION: '18'

jobs:
  coverage-api-gateway:
    name: API Gateway Coverage
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'api-gateway' || github.event.inputs.service == 'all' || github.event.inputs.service == null
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/api-gateway/package-lock.json

    - name: Install dependencies
      working-directory: services/api-gateway
      run: npm ci

    - name: Run tests with coverage
      working-directory: services/api-gateway
      run: npm run test:coverage:lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: services/api-gateway/coverage/lcov.info
        flags: api-gateway
        name: api-gateway-coverage
        fail_ci_if_error: false

  coverage-auth-service:
    name: Auth Service Coverage
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'auth-service' || github.event.inputs.service == 'all' || github.event.inputs.service == null
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/auth-service/package-lock.json

    - name: Install dependencies
      working-directory: services/auth-service
      run: npm ci

    - name: Run tests with coverage
      working-directory: services/auth-service
      run: npm run test:coverage:lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: services/auth-service/coverage/lcov.info
        flags: auth-service
        name: auth-service-coverage
        fail_ci_if_error: false

  coverage-user-service:
    name: User Service Coverage
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'user-service' || github.event.inputs.service == 'all' || github.event.inputs.service == null
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/user-service/package-lock.json

    - name: Install dependencies
      working-directory: services/user-service
      run: npm ci

    - name: Run tests with coverage
      working-directory: services/user-service
      run: npm run test:coverage:lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: services/user-service/coverage/lcov.info
        flags: user-service
        name: user-service-coverage
        fail_ci_if_error: false

  coverage-order-service:
    name: Order Service Coverage
    runs-on: ubuntu-latest
    if: github.event.inputs.service == 'order-service' || github.event.inputs.service == 'all' || github.event.inputs.service == null
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: services/order-service/package-lock.json

    - name: Install dependencies
      working-directory: services/order-service
      run: npm ci

    - name: Run tests with coverage
      working-directory: services/order-service
      run: npm run test:coverage:lcov

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: services/order-service/coverage/lcov.info
        flags: order-service
        name: order-service-coverage
        fail_ci_if_error: false

  coverage-summary:
    name: Coverage Summary
    runs-on: ubuntu-latest
    needs: [coverage-api-gateway, coverage-auth-service, coverage-user-service, coverage-order-service]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Generate coverage summary
      run: |
        echo "📊 Code Coverage Summary"
        echo "========================="
        
        if [ -f "services/api-gateway/coverage/coverage-summary.json" ]; then
          echo "API Gateway: $(cat services/api-gateway/coverage/coverage-summary.json | jq -r '.total.lines.pct')%"
        else
          echo "API Gateway: No coverage data"
        fi
        
        if [ -f "services/auth-service/coverage/coverage-summary.json" ]; then
          echo "Auth Service: $(cat services/auth-service/coverage/coverage-summary.json | jq -r '.total.lines.pct')%"
        else
          echo "Auth Service: No coverage data"
        fi
        
        if [ -f "services/user-service/coverage/coverage-summary.json" ]; then
          echo "User Service: $(cat services/user-service/coverage/coverage-summary.json | jq -r '.total.lines.pct')%"
        else
          echo "User Service: No coverage data"
        fi
        
        if [ -f "services/order-service/coverage/coverage-summary.json" ]; then
          echo "Order Service: $(cat services/order-service/coverage/coverage-summary.json | jq -r '.total.lines.pct')%"
        else
          echo "Order Service: No coverage data"
        fi

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const commentBody = `## 📊 Code Coverage Report
          
          **Coverage Status:** ✅ Completed
          
          **Services Tested:**
          - API Gateway: ${{ needs.coverage-api-gateway.result }}
          - Auth Service: ${{ needs.coverage-auth-service.result }}
          - User Service: ${{ needs.coverage-user-service.result }}
          - Order Service: ${{ needs.coverage-order-service.result }}
          
          **Coverage Reports:**
          - [API Gateway Coverage](https://codecov.io/gh/${{ github.repository }}/flags/api-gateway)
          - [Auth Service Coverage](https://codecov.io/gh/${{ github.repository }}/flags/auth-service)
          - [User Service Coverage](https://codecov.io/gh/${{ github.repository }}/flags/user-service)
          - [Order Service Coverage](https://codecov.io/gh/${{ github.repository }}/flags/order-service)
          
          [View Full Coverage Report](https://codecov.io/gh/${{ github.repository }})`;
          
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: commentBody,
          });

  coverage-badges:
    name: Update Coverage Badges
    runs-on: ubuntu-latest
    needs: [coverage-summary]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Update README with coverage badges
      run: |
        echo "🔄 Updating coverage badges in README..."
        # This would typically update badges in README.md
        # For now, we'll just echo the status
        echo "Coverage badges would be updated here"
