# Dependabot configuration for DevOps E2E Platform
# This file configures automated dependency updates and security scanning

version: 2
updates:
  # Enable version updates for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "npm"
      prefix-development: "npm-dev"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    ignore:
      # Ignore major version updates for critical packages
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "helmet"
        update-types: ["version-update:semver-major"]
      - dependency-name: "winston"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsonwebtoken"
        update-types: ["version-update:semver-major"]

  # API Gateway dependencies
  - package-ecosystem: "npm"
    directory: "/services/api-gateway"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "api-gateway"
      include: "scope"
    labels:
      - "dependencies"
      - "api-gateway"
      - "security"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "helmet"
        update-types: ["version-update:semver-major"]

  # Auth Service dependencies
  - package-ecosystem: "npm"
    directory: "/services/auth-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "auth-service"
      include: "scope"
    labels:
      - "dependencies"
      - "auth-service"
      - "security"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]

  # User Service dependencies
  - package-ecosystem: "npm"
    directory: "/services/user-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "user-service"
      include: "scope"
    labels:
      - "dependencies"
      - "user-service"
      - "security"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]

  # Order Service dependencies
  - package-ecosystem: "npm"
    directory: "/services/order-service"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "order-service"
      include: "scope"
    labels:
      - "dependencies"
      - "order-service"
      - "security"
    ignore:
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]

  # E2E Testing dependencies
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "e2e"
      include: "scope"
    labels:
      - "dependencies"
      - "e2e"
      - "testing"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "docker"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
      - "security"
    ignore:
      # Ignore major version updates for base images
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "github-actions"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
      - "ci-cd"

  # Security advisories
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "dependencies"
      - "high-priority"
    # Security updates should be merged automatically if tests pass
    auto-merge: true
    auto-merge-commit-message: "Auto-merge security update"
    auto-merge-commit-message-options:
      prefix: "security"
      include: "scope"

  # Security advisories for services
  - package-ecosystem: "npm"
    directory: "/services/api-gateway"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "api-gateway"
      - "high-priority"
    auto-merge: true

  - package-ecosystem: "npm"
    directory: "/services/auth-service"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "auth-service"
      - "high-priority"
    auto-merge: true

  - package-ecosystem: "npm"
    directory: "/services/user-service"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "user-service"
      - "high-priority"
    auto-merge: true

  - package-ecosystem: "npm"
    directory: "/services/order-service"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "security"
      include: "scope"
    labels:
      - "security"
      - "order-service"
      - "high-priority"
    auto-merge: true

  # Helm chart dependencies
  - package-ecosystem: "helm"
    directory: "/infrastructure/helm"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "helm"
      include: "scope"
    labels:
      - "dependencies"
      - "helm"
      - "kubernetes"

  # Terraform dependencies (if applicable)
  - package-ecosystem: "terraform"
    directory: "/infrastructure/terraform"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "laxmideepak"
    assignees:
      - "laxmideepak"
    commit-message:
      prefix: "terraform"
      include: "scope"
    labels:
      - "dependencies"
      - "terraform"
      - "infrastructure"
