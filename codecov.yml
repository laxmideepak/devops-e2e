codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: no

coverage:
  precision: 2
  round: down
  range: "80...100"
  status:
    project:
      default:
        target: 80%
        threshold: 5%
        base: auto
        if_ci_fails: error
        only_pulls: false
    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto
        if_ci_fails: error
        only_pulls: false

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

ignore:
  - "**/*.test.js"
  - "**/*.spec.js"
  - "**/tests/**"
  - "**/coverage/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/build/**"
  - "**/.git/**"
  - "**/.github/**"
  - "**/docs/**"
  - "**/scripts/**"
  - "**/infrastructure/**"
  - "**/e2e/**"
  - "**/*.config.js"
  - "**/jest.setup.js"

flags:
  api-gateway:
    paths:
      - "services/api-gateway/src/"
    name: "API Gateway"
    carryforward: true
    
  auth-service:
    paths:
      - "services/auth-service/src/"
    name: "Auth Service"
    carryforward: true
    
  user-service:
    paths:
      - "services/user-service/src/"
    name: "User Service"
    carryforward: true
    
  order-service:
    paths:
      - "services/order-service/src/"
    name: "Order Service"
    carryforward: true

github_checks:
  annotations: yes
